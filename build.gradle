plugins {
    // Same Loom jar, two flavours: "fabric-loom" remaps obfuscated Minecraft (1.21.x),
    // "net.fabricmc.fabric-loom" is for unobfuscated Minecraft (26.x).
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

// ---------------------------------------------------------------------------
// Pick which Minecraft version to build.
//   ./gradlew build                  -> builds the default (mc_version in gradle.properties)
//   ./gradlew build -Pmc=1.21.5      -> builds for 1.21.5
// Each supported version has a small file in versions/ with its settings.
// ---------------------------------------------------------------------------
def mc = project.findProperty('mc') ?: project.property('mc_version')
def versionFile = file("versions/${mc}.properties")
if (!versionFile.exists()) {
    throw new GradleException("Unsupported Minecraft version '${mc}'. Supported: " +
            file('versions').list().findAll { it.endsWith('.properties') }
                    .collect { it - '.properties' }.sort().join(', '))
}
def v = new Properties()
versionFile.withInputStream { v.load(it) }
def unobf = v.unobfuscated == 'true'
def javaVersion = (v.java ?: '21') as int

apply plugin: unobf ? 'net.fabricmc.fabric-loom' : 'fabric-loom'

version = "${project.mod_version}+${mc}"
group = project.maven_group
base { archivesName = project.archives_base_name }

// Code shared by every version lives in src/main.
// Code that differs between Minecraft versions lives in src/<variant>
// (the folders for each Minecraft version are listed in versions/<mc>.properties).
sourceSets {
    main {
        v.variant.split(',').each {
            java.srcDir "src/${it.trim()}/java"
            resources.srcDir "src/${it.trim()}/resources"
        }
    }
}

repositories {
    // Loom adds the Minecraft and Fabric repositories automatically.
    maven { url = 'https://maven.terraformersmc.com/releases/' } // Mod Menu
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (unobf) {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${v.fabric_api_version}"
        compileOnly "com.terraformersmc:modmenu:${v.modmenu_version}"
        localRuntime "com.terraformersmc:modmenu:${v.modmenu_version}" // only in ./gradlew runClient
    } else {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${v.fabric_api_version}"
        modCompileOnly "com.terraformersmc:modmenu:${v.modmenu_version}"
        modLocalRuntime "com.terraformersmc:modmenu:${v.modmenu_version}" // only in ./gradlew runClient
    }
}

processResources {
    def props = [version: project.mod_version, minecraft_version: mc, java_version: javaVersion]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

// Name the jar like the ones on Modrinth: keycps-1.6+1.21.5.jar
tasks.named(unobf ? 'jar' : 'remapJar') {
    archiveFileName = "keycps-${project.version}.jar"
}
