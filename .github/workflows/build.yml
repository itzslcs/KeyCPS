name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ "1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5",
              "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11",
              "26.1", "26.1.1", "26.1.2", "26.2", "26.3" ]
    name: Minecraft ${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmc=${{ matrix.mc }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: keycps-${{ matrix.mc }}
          path: build/libs/keycps-*.jar
